name: Hungry Snake CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, "audit/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
